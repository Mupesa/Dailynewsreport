name: Daily Intelligence & News Briefing

on:
  schedule:
    # 02:00 UTC = 06:00 AM Mauritius Time (UTC+4) every day
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  run-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Daily Intelligence Orchestrator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python main.py

      - name: Commit Archive and Updated Memory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json archive/
          git diff --staged --quiet || (git commit -m "chore: auto-archive daily briefing & update learning memory [skip ci]" && git push)
